services:
  - type: web
    name: acf-portal
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_GGRC_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: acf-ggrc-receipt-server
    runtime: docker
    dockerContext: ./server
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 3001
      - key: CORS_ORIGIN
        sync: false
      - key: REQUEST_TIMEOUT_MS
        value: 60000

